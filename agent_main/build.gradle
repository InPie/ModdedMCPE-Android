plugins {
    id 'com.android.library'
}

android {
    namespace = "com.mojang.minecraftpe"
    compileSdk 36 // Android 16

    defaultConfig {
        minSdk 25

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'com.google.firebase:firebase-iid:21.1.0'
    compileOnly 'com.google.firebase:firebase-common:20.0.0'
    compileOnly 'com.google.android.gms:play-services-tasks:17.2.1'
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs.add("-Xlint:-options")
}

String getSdkPath() {
    File localPropertiesFile = new File(project.rootDir, "local.properties")
    Properties localProperties = new Properties()
    localProperties.load(new FileReader(localPropertiesFile))
    return localProperties.getProperty("sdk.dir")
}

String d8Executable() {
    def buildToolsVersion = "36.0.0" // real

    def sdkPath = getSdkPath()
    def buildToolsDir = "${sdkPath}/build-tools/${buildToolsVersion}/"
    return System.properties['os.name'].toLowerCase().contains("windows") ?
            "${buildToolsDir}d8.bat" : "${buildToolsDir}d8"
}

def outputDir = new File(rootDir, "endercore/src/main/assets/endercore/android").absolutePath

import javax.inject.Inject
import org.gradle.process.ExecOperations
import org.gradle.api.file.FileSystemOperations

abstract class D8Task extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getClassFiles()

    @OutputFile
    abstract RegularFileProperty getOutputDex()

    @Input
    abstract Property<String> getD8Executable()

    @Input
    abstract Property<String> getJavaHome()

    @Inject
    abstract ExecOperations getExecOperations()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void doD8() {
        def outDir = getOutputDex().get().asFile.parentFile
        def tempDir = new File(outDir, "temp_d8_" + name)
        tempDir.mkdirs()

        getExecOperations().exec { spec ->
            def inputs = getClassFiles().files.findAll { it.exists() }.collect { it.absolutePath }
            if (inputs.isEmpty()) {
                throw new GradleException("No input classes found for " + name)
            }
            spec.commandLine([getD8Executable().get(), "--output", tempDir.absolutePath] + inputs)
            spec.environment("JAVA_HOME", getJavaHome().get())
        }

        def tempDex = new File(tempDir, "classes.dex")
        def destDex = getOutputDex().get().asFile
        if (tempDex.exists()) {
            getFs().copy { spec ->
                spec.from(tempDex)
                spec.into(destDex.parentFile)
                spec.rename("classes.dex", destDex.name)
            }
        }
        tempDir.deleteDir()
    }
}

def registerDexTasks = { String variantName ->
    def variantTaskName = variantName.substring(0, 1).toUpperCase() + variantName.substring(1)
    def compileTaskName = "compile${variantTaskName}JavaWithJavac"
    def classesDir = layout.buildDirectory.dir("intermediates/javac/${variantName}/${compileTaskName}/classes")
    def d8Exe = d8Executable()

    def buildAgentMainDex = tasks.register("buildAgentMainDex${variantTaskName}", D8Task) {
        dependsOn(compileTaskName)
        d8Executable.set(d8Exe)
        javaHome.set(System.getProperty("java.home"))
        outputDex.set(file(new File(outputDir, "AgentMainActivity.dex")))
        
        classFiles.from(
            fileTree(dir: classesDir).matching {
                include "com/microsoft/xbox/idp/telemetry/helpers/**/*.class"
                include "com/google/firebase/iid/FirebaseInstanceId*.class"
                include "com/google/firebase/FirebaseApp*.class"
                include "com/google/firebase/FirebaseOptions*.class"
                include "junit/framework/**/*.class" // for 0.15
                include "com/mojang/minecraftpe/AgentMainActivity.class"
                include "com/mojang/minecraftpe/GameContextBridge.class"
                include "com/mojang/minecraftpe/NotificationListenerService.class" // for 1.19+
                include "com/mojang/minecraftpe/BrazeManager.class" // for 1.19+
                include "com/google/android/gms/common/internal/StringResourceValueReader.class"
                include "com/microsoft/onlineid/internal/PackageInfoHelper.class"
                include "com/microsoft/onlineid/internal/Resources.class"
                include "com/microsoft/xbox/idp/telemetry/utc/model/UTCAdditionalInfoModel.class"
            }
        )
    }

    def buildCrackedLicenseDex = tasks.register("buildCrackedLicenseDex${variantTaskName}", D8Task) {
        dependsOn(compileTaskName)
        d8Executable.set(d8Exe)
        javaHome.set(System.getProperty("java.home"))
        outputDex.set(file(new File(outputDir, "CrackedLicense.dex")))

        classFiles.from(
            fileTree(dir: classesDir).matching {
                include "com/mojang/minecraftpe/store/amazonappstore/AmazonAppStore.class"
                include "com/mojang/minecraftpe/store/googleplay/GooglePlayStore.class"
            }
        )
    }

    return tasks.register("buildDex${variantTaskName}") {
        dependsOn buildAgentMainDex, buildCrackedLicenseDex
    }
}

def buildDexDebug = registerDexTasks("debug")
def buildDexRelease = registerDexTasks("release")

afterEvaluate {
    tasks.named("compileDebugJavaWithJavac") {
        it.finalizedBy(buildDexDebug)
    }
    tasks.named("compileReleaseJavaWithJavac") {
        it.finalizedBy(buildDexRelease)
    }

    // priority
    def endercoreProject = project(':endercore')
    endercoreProject.tasks.configureEach { task ->
        if (task.name.toLowerCase().contains("release")) {
            task.mustRunAfter(buildDexRelease)
        } else if (task.name.toLowerCase().contains("debug")) {
            task.mustRunAfter(buildDexDebug)
        }
    }
}
